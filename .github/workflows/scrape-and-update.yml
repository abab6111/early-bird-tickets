name: Scrape and Update Web Content

permissions:
  contents: write

on:
  schedule:
    - cron: '0 1 * * *'  # 每天凌晨 1 點執行，使用 UTC 時間
  workflow_dispatch:

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scrape website content and convert to JSON
        run: |
          import requests
          from bs4 import BeautifulSoup
          import json

          # 擷取網頁資料
          url = 'https://thsrc.com.tw'
          response = requests.get(url)
          response.encoding = 'utf-8'

          # 解析 HTML
          soup = BeautifulSoup(response.text, 'html.parser')

          # 尋找目標表格
          table = soup.find_all('table', {'class': 'table', 'summary': '每年台灣連續假日/重要節日/疏運期開放高鐵車票購買日期清單'})

          # 擷取表格欄位名稱（表頭）
          headers = []
          for tbl in table:
              thead = tbl.find('thead')
              if thead:
                  headers.append([th.text.strip() for th in thead.find_all('th')])

          # 擷取表格資料列
          rows = []
          for tbl in table:
              tbody = tbl.find('tbody')
              if tbody:
                  for tr in tbody.find_all('tr'):
                      cols = tr.find_all('td')
                      cols = [col.text.strip() for col in cols]
                      rows.append(cols)

          # 將表格資料轉換為 JSON 格式
          data_list = []
          for row in rows:
              if len(row) == len(headers[0]):  # 確保資料列長度與表頭長度一致
                  try:
                      row_data = {str(headers[0][i]): str(row[i]) for i in range(len(headers[0]))}
                      data_list.append(row_data)
                  except Exception as e:
                      print(f"錯誤: {e}，資料列: {row}，表頭: {headers[0]}")
              else:
                  print(f"Len(row) 與 len(headers[0])不一致:")

          # 印出 JSON 資料
          json_data = json.dumps(data_list, ensure_ascii=False, indent=4)
          print(json_data)

          # 將 JSON 資料儲存至檔案
          with open('docs/THSR_Holiday.json', 'w', encoding='utf-8') as json_file:
              json_file.write(json_data)
        shell: python

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'

      - name: Commit and push changes
        run: |
          git add docs/THSR_Holiday.json
          git commit --allow-empty -m "Scheduled update: $(date +'%Y-%m-%d %H:%M:%S') (UTC)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
